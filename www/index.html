 const rows=adj.map((a,i)=>`<div class="adj ${a.k}"><span class="sg">${a.k=='dis'?'➖':'➕'}</span>${selN('pp',j,'adj',i,'m',[['b','فطار'],['l','غدا'],['d','عشا'],['o','أخرى']],a.m)}<input ${IN} data-ls="pp" data-i="${j}" data-sub="adj" data-si="${i}" data-k="a" value="${esc(a.a??'')}" placeholder="المبلغ"><button class="ib" data-dla="${j}:${i}">✕</button></div>`).join('');

function hostPush(){if(!LAN.host||LAN.apply)return;clearTimeout(LAN.pt);
 LAN.pt=setTimeout(()=>{const l=LH(),c=DB.list.find(x=>x.id===LAN.cid);if(l&&c)l.setState({state:JSON.stringify(c)})},250)}

async function lanStart(){const l=LH();if(!l){toast('الاستضافة متاحة في تطبيق الأندرويد بس');return}
 const rnd=()=>Math.random().toString(36).slice(2,10);LAN.vt=rnd();LAN.cid=DB.cur;LAN.all=0;LAN.list=[];
 try{const r=await l.start({port:LAN.port,viewToken:LAN.vt,state:JSON.stringify(C())});
  LAN.ips=r.ips||[];LAN.port=r.port||LAN.port;LAN.host=1;LAN.n=0;
  if(!LAN.lis){LAN.lis=1;l.addListener('edit',lanEdit);l.addListener('clients',ev=>{const old=LAN.list||[];LAN.list=ev.list||[];LAN.n=ev.count;lanPill();const e=$('#lann');if(e)e.textContent=ev.count;
   LAN.list.filter(x=>x.req&&!old.some(o=>o.id==x.id&&o.req)).forEach(x=>{toast('🙋 '+(x.name||'جهاز')+' بيطلب صلاحية التعديل');fx('warn',[30,40,30])});lanDev()})}
  lanPill();lanSheet();fx('win',[20,40,20])}

function mixW(h,p){const n=parseInt(h.slice(1),16),m=v=>Math.round(v*p+255*(1-p));return`rgb(${m(n>>16)},${m(n>>8&255)},${m(n&255)})`}

 else if(it.t=='label'){fill='none';sk=ex?'none':'var(--br)';body+=T(cx,y+h/2+5,14,it.nm||'نص',700,tx)}
